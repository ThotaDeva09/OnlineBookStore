
<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Online Book Store</h1>

        <div class="row mb-4">

            <div class="col-md-8 mb-2">
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Search book name..."
                >
            </div>

            <div class="col-md-2 mb-2">
                <select id="limitInput" class="form-select">
                    <option value="10">10 Books</option>
                    <option value="20">20 Books</option>
                    <option value="30">30 Books</option>
                </select>
            </div>

            <div class="col-md-2 mb-2">
                <button id="searchButton" class="btn btn-primary w-100">
                    Search
                </button>
            </div>

        </div>

        <p id="statusMessage" class="text-center"></p>

        <div id="booksContainer" class="row"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
